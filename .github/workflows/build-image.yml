# 构建并推送 Docker 镜像到 GitHub 容器仓库（GHCR）
#
# 触发时机：
#   - 推送到 main 分支
#   - 打上 v* 形式的标签（例如 v1.0.0）
#   - 在 Actions 页面手动点 “Run workflow”
#
# 镜像地址：ghcr.io/<仓库所有者>/kaoyandazi
# 标签规则：
#   - 分支推送 → main、latest
#   - 打标签   → 版本号、对应的次版本号（v1.2.3 → 1.2）、latest
#   - 手动运行 → 提交短 SHA
#
# 用到的凭据是仓库自带的 GITHUB_TOKEN，不需要自己配密钥。
# 如需让其他人也能拉取镜像，请到仓库 Settings → Actions → General →
# Workflow permissions 把权限设为 Read and write，并在 Packages 里把镜像设为公开。

name: 构建镜像

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: 构建并推送
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Buildx（支持多架构与缓存）
        uses: docker/setup-buildx-action@v3

      - name: 登录容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 同时产出 amd64 与 arm64，服务器和 Apple 芯片电脑都能直接用
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写出构建摘要
        run: |
          echo "### 镜像已推送 :whale:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "拉取并运行：" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker run -d -p 3000:3000 -v \$PWD/data:/app/data \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --env-file .env ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
